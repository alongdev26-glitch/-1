<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>תרגול מתמטיקה – כיתה ח׳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d0a1c; --card:#1a1535; --card2:#251e49; --line:#3a3170;
  --text:#f4f1ff; --muted:#aaa3d4;
  --purple:#a78bfa; --teal:#2dd4bf; --orange:#fb923c; --pink:#f472b6; --sky:#38bdf8;
  --good:#34d399; --bad:#fb7185; --warn:#facc15;
  --c:var(--purple);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{
  background:radial-gradient(1200px 600px at 100% -10%,#2b1d63 0%,transparent 60%),
             radial-gradient(900px 500px at -10% 110%,#0f3b44 0%,transparent 55%),var(--bg);
  background-attachment:fixed;
  color:var(--text);font-family:'Heebo','Rubik',Arial,sans-serif;font-size:18px;line-height:1.55;
  min-height:100vh;
}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0}
bdi{unicode-bidi:isolate}
.app{max-width:760px;margin:0 auto;padding:0 16px 40px}

/* top bar */
#top{position:sticky;top:0;z-index:20;background:rgba(13,10,28,.88);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);padding:10px 16px 0}
.topin{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:46px}
.topin .ttl{flex:1;font-weight:800;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:700;font-size:16px;white-space:nowrap}
.iconbtn{background:var(--card2);border:1px solid var(--line);border-radius:14px;width:46px;height:46px;font-size:22px}
#barWrap{max-width:760px;margin:8px auto 0;height:10px;background:var(--card2);border-radius:10px;overflow:hidden;display:none}
#bar{height:100%;width:0;background:linear-gradient(90deg,var(--purple),var(--teal),var(--orange));border-radius:10px;transition:width .5s cubic-bezier(.2,.9,.3,1)}
#barTxt{max-width:760px;margin:2px auto 6px;font-size:13px;color:var(--muted);display:none}

/* home */
h1{font-size:30px;margin:22px 0 4px;font-weight:800;line-height:1.2}
h1 span{background:linear-gradient(90deg,var(--purple),var(--teal),var(--orange));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:0 0 16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;text-align:center}
.stat b{display:block;font-size:26px;font-weight:800}
.stat small{color:var(--muted);font-size:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chips .lbl{color:var(--muted);font-size:15px}
.chip{background:var(--card2);border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;min-height:44px}
.chip.on{border-color:var(--teal);background:#0f3b44;color:#fff}
.reco{background:linear-gradient(135deg,#3a2470,#16404a);border:1px solid var(--line);border-radius:22px;padding:16px;margin:14px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.reco .t{flex:1;min-width:200px}
.grid{display:grid;grid-template-columns:1fr;gap:14px;margin:16px 0}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr}}
.tcard{--c:var(--purple);text-align:right;background:var(--card);border:2px solid color-mix(in srgb,var(--c) 55%,transparent);
  border-radius:26px;padding:18px;position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s;min-height:150px;display:block;width:100%}
.tcard::before{content:"";position:absolute;inset:0;background:radial-gradient(300px 140px at 90% 0,color-mix(in srgb,var(--c) 28%,transparent),transparent 70%)}
.tcard:hover,.tcard:active{transform:translateY(-3px) scale(1.01);box-shadow:0 10px 30px -10px var(--c)}
.tcard>*{position:relative}
.tcard .ic{font-size:36px}
.tcard h3{margin:2px 0 2px;font-size:22px;color:var(--c);font-weight:800}
.tcard p{margin:0 0 10px;color:var(--muted);font-size:15px;line-height:1.4}
.mini{height:8px;background:#ffffff1a;border-radius:8px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--c);border-radius:8px}
.tcard small{color:var(--muted);font-size:13px}
.mixed{width:100%;background:linear-gradient(90deg,var(--purple),var(--pink),var(--orange));color:#1a0f33;font-weight:800;font-size:22px;border-radius:24px;padding:20px;min-height:68px;box-shadow:0 10px 30px -10px var(--pink);transition:transform .2s}
.mixed:active{transform:scale(.98)}
.row2{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}
.btn2{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;font-weight:700;min-height:54px}

/* question */
.qcard{background:var(--card);border:2px solid color-mix(in srgb,var(--c) 60%,transparent);border-radius:28px;padding:18px;margin-top:14px;animation:slideIn .45s cubic-bezier(.2,.9,.3,1)}
.qcard.leave{animation:slideOut .2s ease-in forwards}
@keyframes slideIn{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes slideOut{to{opacity:0;transform:translateX(40px)}}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tag{background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c);border-radius:999px;padding:4px 14px;font-weight:800;font-size:15px}
.qnum{color:var(--muted);font-size:15px}
.qtext{font-size:21px;font-weight:500;line-height:1.6;margin:6px 0 12px}
.qtext b{color:var(--c)}
.svgbox{background:var(--card2);border-radius:20px;padding:8px;margin:8px 0 14px;display:flex;justify-content:center}
.svgbox svg{width:100%;max-width:440px;height:auto;display:block}
.ansrow{display:flex;gap:10px}
.ansrow input{flex:1;min-width:0;font-family:inherit;font-size:24px;font-weight:700;text-align:center;height:60px;border-radius:18px;border:2px solid var(--line);background:#120e29;color:#fff;padding:0 12px;outline:none;direction:ltr}
.ansrow input::placeholder{color:#6d66a0;font-weight:400;font-size:17px;direction:rtl}
.ansrow input:focus{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 25%,transparent)}
.ansrow input:disabled{opacity:.85}
.ansrow input.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.go{background:var(--c);color:#14102b;font-weight:800;border-radius:18px;padding:0 24px;min-height:60px;font-size:20px;transition:transform .15s}
.go:active{transform:scale(.95)}
.go:disabled{opacity:.4}
.ynrow{display:flex;gap:10px;margin-top:10px}
.ynrow .chip{flex:1;font-size:20px}
.hintrow{margin-top:12px;display:flex;gap:10px;flex-wrap:wrap}
.hbtn{background:#3b3115;color:var(--warn);border:2px solid #6b5a1c;border-radius:16px;padding:10px 18px;font-weight:700;min-height:48px}
.hbtn:disabled{opacity:.4}
.hint{background:#2b2410;border:1px dashed #8a7425;color:#fde68a;border-radius:16px;padding:10px 14px;margin-top:10px;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.fb{margin-top:14px;border-radius:20px;padding:14px 16px;animation:pop .4s}
.fb.ok{background:#0e3a2e;border:2px solid var(--good)}
.fb.no{background:#3d1424;border:2px solid var(--bad)}
.fb h4{margin:0 0 6px;font-size:22px}
.fb.ok h4{color:var(--good)} .fb.no h4{color:var(--bad)}
.fb ol{margin:8px 0 0;padding-inline-start:24px}
.fb li{margin:6px 0}
.mistake{background:#00000030;border-radius:12px;padding:8px 12px;margin:8px 0}
.link{background:none;color:var(--teal);text-decoration:underline;padding:6px 0;font-weight:700}
.nav{display:flex;gap:10px;margin-top:16px}
.nav button{flex:1;min-height:58px;border-radius:18px;font-weight:800;font-size:19px;background:var(--card2);border:2px solid var(--line)}
.nav button.primary{background:var(--c);color:#14102b;border-color:var(--c)}
.nav button:disabled{opacity:.35}
.pulse{animation:pulse .6s}
@keyframes pulse{40%{transform:scale(1.025);box-shadow:0 0 40px -5px var(--good)}}

/* history */
.hitem{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 0;overflow:hidden}
.hitem summary{padding:12px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;list-style:none}
.hitem summary::-webkit-details-marker{display:none}
.hitem .mk{font-size:22px}
.hitem .sn{flex:1;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hitem .bd{padding:0 14px 14px;font-size:16px}
.hitem .bd ol{padding-inline-start:22px;margin:6px 0}
.tg{font-size:13px;font-weight:800;border-radius:999px;padding:2px 10px;background:color-mix(in srgb,var(--c) 25%,transparent);color:var(--c);white-space:nowrap}

/* modal + fx */
#modal{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
#modal.on{display:flex}
.mbox{background:var(--card);border:2px solid var(--teal);border-radius:28px;padding:24px;max-width:420px;width:100%;text-align:center;animation:pop .4s}
.mbox h2{margin:0 0 6px;font-size:28px}
.mbox .big{font-size:56px;font-weight:800;color:var(--teal)}
.mbox .row2{margin-bottom:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.conf{position:absolute;left:50%;top:55%;font-size:26px;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:420px){body{font-size:17px}.qtext{font-size:19px}h1{font-size:26px}}
</style>
</head>
<body>
<div id="top">
  <div class="topin">
    <button class="iconbtn" id="homeBtn" aria-label="בית" onclick="goHome()">🏠</button>
    <div class="ttl" id="topTitle">תרגול מתמטיקה</div>
    <div class="pill" id="streakChip">🔥 0</div>
  </div>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="barTxt"></div>
</div>
<div class="app"><main id="view"></main></div>
<div id="modal"></div>
<div id="fx"></div>

<script>
/* ============ כלי עזר ============ */
const $=s=>document.querySelector(s);
const ri=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[ri(0,a.length-1)];
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const rnd=x=>Math.round(x*1e6)/1e6;
const nf=x=>rnd(x).toLocaleString('en-US');
const near=(a,b)=>Math.abs(a-b)<0.011;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const MTOK='(?:<b>)?(?:√?[\\d.,]+²?|x²?)(?:</b>)?';
const MRE=new RegExp(MTOK+'(?:\\s*[+−×÷=·]\\s*'+MTOK+')+','g');
const mathify=h=>String(h).replace(MRE,m=>`<bdi dir="ltr">${m}</bdi>`);
const L=s=>`<bdi dir="ltr">${s}</bdi>`;
const R=arr=>L(arr.join(':'));
const sq=x=>rnd(x*x);

const TOPICS=['ratio','prop','scale','pyth','speed'];
const NAME={ratio:'יחס',prop:'פרופורציה',scale:'קנה מידה',pyth:'משפט פיתגורס',speed:'זמן, מרחק ומהירות'};
const ICON={ratio:'🧩',prop:'⚖️',scale:'🗺️',pyth:'📐',speed:'🚗'};
const COL={ratio:'#a78bfa',prop:'#2dd4bf',scale:'#fb923c',pyth:'#f472b6',speed:'#38bdf8'};
const DESC={ratio:'צמצום יחס וחלוקה לפי יחס',prop:'כפל בהצלבה ושאלות מילוליות',scale:'מפה, מציאות, יחידות ושטח',pyth:'יתר, ניצב ובדיקת משולש',speed:'זמן = מרחק ÷ מהירות'};
const LVN=['קל','בינוני','קשה'];
const PC=['#a78bfa','#2dd4bf','#fb923c'];

/* ============ SVG ============ */
const svgWrap=(h,inner)=>`<svg viewBox="0 0 340 ${h}" xmlns="http://www.w3.org/2000/svg" role="img">${inner}</svg>`;
const FL={start:'end',end:'start',middle:'middle'};
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${FL[o.a||'middle']}" font-size="${o.s||14}" fill="${o.f||'#e9e5ff'}" font-weight="${o.w||600}" font-family="Heebo,Arial,sans-serif">${s}</text>`;
const lab=(x,y,txt,col,a)=>String(txt).trim()==='?'?T(x,y+4,'?',{a,s:26,f:'#facc15',w:800}):T(x,y,txt,{a,s:15,f:col,w:700});

function squaresSvg(parts,names){
  const mx=Math.max(...parts), gap=3, sz=Math.max(8,Math.min(24,Math.floor(222/mx)-gap)), rowH=sz+14;
  let s='';
  parts.forEach((n,j)=>{
    const y=12+j*rowH;
    s+=T(332,y+sz/2+5,names[j],{a:'end',s:13,f:PC[j]});
    for(let i=0;i<n;i++)s+=`<rect x="${230-i*(sz+gap)-sz+gap*0}" y="${y}" width="${sz}" height="${sz}" rx="5" fill="${PC[j]}"/>`;
  });
  return svgWrap(parts.length*rowH+20,s);
}
function barsSvg(vals){
  const mx=Math.max(...vals);let s='';
  vals.forEach((v,j)=>{const w=Math.max(20,Math.round(230*v/mx)),y=14+j*38;
    s+=`<rect x="${320-w}" y="${y}" width="${w}" height="26" rx="8" fill="${PC[j]}"/>`+T(320-w-8,y+19,v,{a:'end',s:16,f:PC[j],w:800});});
  return svgWrap(vals.length*38+20,s);
}
function propSvg(v,h){
  const t=i=>i===h?`<tspan fill="#facc15" font-size="30" font-weight="800">x</tspan>`:v[i];
  const fx=(cx,top,bot)=>T(cx,64,t(top),{s:26,w:800})+`<line x1="${cx-34}" y1="76" x2="${cx+34}" y2="76" stroke="#e9e5ff" stroke-width="3" stroke-linecap="round"/>`+T(cx,108,t(bot),{s:26,w:800});
  return svgWrap(170,
    `<line x1="118" y1="56" x2="222" y2="100" stroke="${PC[1]}" stroke-width="3" stroke-dasharray="6 5"/>`+
    `<line x1="118" y1="100" x2="222" y2="56" stroke="${PC[2]}" stroke-width="3" stroke-dasharray="6 5"/>`+
    fx(95,0,1)+T(170,86,'=',{s:30,w:800,f:'#aaa3d4'})+fx(245,2,3)+
    T(170,150,'כפל בהצלבה: האלכסונים שווים',{s:13,f:'#aaa3d4'}));
}
function tableSvg(h1,h2,rows){
  let s='';const rh=42,top=10;
  s+=`<rect x="20" y="${top}" width="300" height="${rh}" rx="10" fill="#3b2f78"/>`+T(245,top+27,h1,{s:15,f:'#2dd4bf'})+T(95,top+27,h2,{s:15,f:'#fb923c'});
  rows.forEach((r,i)=>{const y=top+rh+6+i*(rh+6);
    s+=`<rect x="20" y="${y}" width="300" height="${rh}" rx="10" fill="#120e29" stroke="#3a3170"/>`+lab(245,y+27,r[0],'#fff','middle')+lab(95,y+27,r[1],'#fff','middle');});
  return svgWrap(top+(rows.length+1)*(rh+6)+10,s);
}
function ladderSvg(fi,ti){
  const names=['ק״מ','מטר','ס״מ'],xs=[255,170,85];let s='';
  names.forEach((n,i)=>{const hl=i===fi?'#fb923c':i===ti?'#2dd4bf':'#3a3170';
    s+=`<rect x="${xs[i]-36}" y="40" width="72" height="46" rx="14" fill="#120e29" stroke="${hl}" stroke-width="3"/>`+T(xs[i],70,n,{s:17,f:i===fi?'#fb923c':i===ti?'#2dd4bf':'#e9e5ff',w:800});});
  s+=T(212,30,'×1000 ←',{s:13,f:'#aaa3d4'})+T(127,30,'×100 ←',{s:13,f:'#aaa3d4'})+T(212,112,'→ ÷1000',{s:13,f:'#aaa3d4'})+T(127,112,'→ ÷100',{s:13,f:'#aaa3d4'});
  s+=T(170,140,'לכיוון יחידה קטנה – מכפילים, לכיוון יחידה גדולה – מחלקים',{s:12,f:'#aaa3d4'});
  return svgWrap(150,s);
}
function scaleLineSvg(mapL,realL,N){
  return svgWrap(170,
    T(332,22,'🗺️ במפה',{a:'end',s:14,f:'#a78bfa'})+
    `<line x1="250" y1="42" x2="170" y2="42" stroke="#a78bfa" stroke-width="7" stroke-linecap="round"/>`+
    `<line x1="250" y1="32" x2="250" y2="52" stroke="#a78bfa" stroke-width="3"/><line x1="170" y1="32" x2="170" y2="52" stroke="#a78bfa" stroke-width="3"/>`+
    lab(210,28,mapL,'#c4b5fd','middle')+
    `<line x1="250" y1="56" x2="320" y2="112" stroke="#aaa3d4" stroke-dasharray="4 4"/><line x1="170" y1="56" x2="20" y2="112" stroke="#aaa3d4" stroke-dasharray="4 4"/>`+
    T(170,84,`קנה מידה 1:${N}`,{s:13,f:'#facc15'})+
    T(332,104,'🌍 במציאות',{a:'end',s:14,f:'#fb923c'})+
    `<line x1="320" y1="124" x2="20" y2="124" stroke="#fb923c" stroke-width="7" stroke-linecap="round"/>`+
    `<line x1="320" y1="114" x2="320" y2="134" stroke="#fb923c" stroke-width="3"/><line x1="20" y1="114" x2="20" y2="134" stroke="#fb923c" stroke-width="3"/>`+
    lab(170,154,realL,'#fdba74','middle'));
}
function scaleAreaSvg(a,b,la,lb,N){
  const r=Math.min(1.7,Math.max(.6,a/b));
  let bw,bh;if(r>=1){bw=170;bh=bw/r}else{bh=110;bw=bh*r}
  const sw=bw*.38,sh=bh*.38;
  return svgWrap(165,
    T(290,18,'במפה',{s:14,f:'#a78bfa'})+
    `<rect x="${340-30-sw-0}" y="40" width="${sw}" height="${sh}" rx="4" fill="#a78bfa44" stroke="#a78bfa" stroke-width="3"/>`.replace(`x="${340-30-sw}"`,`x="${260-sw/2}"`)+
    T(260,40+sh+18,`${la} × ${lb} ס״מ`,{s:12,f:'#c4b5fd'})+
    T(115,18,'במציאות',{s:14,f:'#fb923c'})+
    `<rect x="${115-bw/2*0.8}" y="28" width="${bw*0.8}" height="${bh*0.8}" rx="6" fill="#fb923c33" stroke="#fb923c" stroke-width="3"/>`+
    T(115,28+bh*0.4+8,'שטח = ?',{s:20,f:'#facc15',w:800})+
    T(115,28+bh*0.8+20,`קנה מידה 1:${N}`,{s:12,f:'#aaa3d4'})+
    T(190,100,'←',{s:26,f:'#aaa3d4'}));
}
function triSvg(o){
  const mode=o.mode||'tri',G='#2dd4bf',P='#a78bfa',O='#fb923c';
  if(mode==='plain'){
    return svgWrap(200,
      `<polygon points="50,165 290,165 120,45" fill="#f472b61f" stroke="#f472b6" stroke-width="4" stroke-linejoin="round"/>`+
      lab(170,188,o.la,P,'middle')+lab(78,100,o.lb,G,'end')+lab(216,92,o.lc,O,'start'));
  }
  const a=+o.a,b=+o.b,asp=Math.min(1.8,Math.max(.6,a/b));
  let w,h;if(asp>=1){w=210;h=w/asp}else{h=125;w=h*asp}
  const x0=(340-w)/2,y0=172;
  if(mode==='rect'){
    const yt=y0-h-8;
    return svgWrap(200,
      `<rect x="${x0}" y="${yt}" width="${w}" height="${h}" rx="6" fill="#f472b61f" stroke="#f472b6" stroke-width="4"/>`+
      `<line x1="${x0}" y1="${yt}" x2="${x0+w}" y2="${yt+h}" stroke="${O}" stroke-width="4" stroke-dasharray="8 6"/>`+
      lab(x0+w/2,yt-8,o.la,P,'middle')+lab(x0+w+8,yt+h/2+5,o.lb,G,'start')+
      `<rect x="${x0+w/2-40}" y="${yt+h/2-4}" width="80" height="30" rx="8" fill="#251e49"/>`+lab(x0+w/2,yt+h/2+17,o.lc,O,'middle'));
  }
  if(mode==='walk'){
    const yT=y0-h,xE=x0+w,len=Math.hypot(w,h),mx=x0+w/2,my=(y0+yT)/2;
    return svgWrap(200,

    steps:[`ההפרש בחלקים: ${b} − ${a} = <b>${b-a}</b>.`,`ההפרש בפועל הוא ${d}, לכן חלק אחד = ${d} ÷ ${b-a} = <b>${k}</b>.`,`${N[i][1]} הם ${parts[i]} חלקים: ${parts[i]} × ${k} = <b>${ans}</b>.`],

      for(let g=0;g<100;g++){t=lv===0?ri(1,6):ri(2,12)/2;D=rnd(v*t);if(Number.isInteger(D))break}
      return mk('speed',lv,{
        text:`${who}<br><b>כמה שעות יימשך מסע של ${D} ק״מ?</b>`,svg:routeSvg(`${D} ק״מ`,'',`${v} קמ״ש`),ans:t,unit:'שעות',
        hints:['הנוסחה: זמן = מרחק ÷ מהירות.',`המרחק הוא ${D} ק״מ והמהירות ${v} קמ״ש. היחידות מתאימות (ק״מ עם ק״מ לשעה), אז התוצאה תהיה בשעות.`,`חשבו ${D} ÷ ${v}. אם יצא עשרוני, למשל 1.5 – זה שעה וחצי.`],
        steps:['זמן = מרחק ÷ מהירות',`זמן = ${D} ÷ ${v} = <b>${t}</b> שעות`],
        diag:wrongs([[rnd(D*v),'כפלתם. אבל זמן = מרחק ÷ מהירות.'],[rnd(v/D),'הפכתם את החילוק. צריך מרחק ÷ מהירות.'],[rnd(t*60),'הפכתם לדקות, אבל שאלו בשעות.']])
      });
    }
    for(let g=0;g<200;g++){t=pick([10,15,20,30,40,45,50,75,90]);D=rnd(v*t/60);if(D*2===Math.round(D*2)&&D>=1)break}
    const h=rnd(t/60);
    return mk('speed',lv,{
      text:`${who}<br><b>כמה דקות יימשך מסע של ${D} ק״מ?</b>`,svg:routeSvg(`${D} ק״מ`,'',`${v} קמ״ש`),ans:t,unit:'דקות',
      hints:['זמן = מרחק ÷ מהירות. התוצאה תצא בשעות.',`חשבו ${D} ÷ ${v} (בשעות).`,'כדי לעבור משעות לדקות – כפלו ב-60.'],
      steps:['זמן = מרחק ÷ מהירות',`${D} ÷ ${v} = ${h} שעות`,`בדקות: ${h} × 60 = <b>${t}</b> דקות`],
      diag:wrongs([[h,'זה הזמן בשעות. שאלו בדקות, אז כפלו ב-60.'],[rnd(D*v),'זמן = מרחק ÷ מהירות, לא כפל.']])
    });
  }
  if(kind==='mismatch'){
    let t,Dm,vv=pick([3,4,5,6,12,15,18,20,30,36]);
    for(let g=0;g<300;g++){t=pick([5,10,12,15,20,24,30,36,40,45,60]);Dm=vv*1000*t/60;if(Number.isInteger(Dm)&&Dm>=100&&Dm%50===0)break}
    const km=rnd(Dm/1000),h=rnd(t/60);
    return mk('speed',lv,{
      text:`רוכב ברכיבה במהירות קבועה של ${vv} קמ״ש.<br><b>כמה דקות ייקח לו לעבור ${nf(Dm)} מטר?</b>`,svg:routeSvg(`${nf(Dm)} מטר`,'',`${vv} קמ״ש`),ans:t,unit:'דקות',
      hints:['שימו לב: המרחק במטרים והמהירות בק״מ לשעה. צריך להמיר לאותה יחידה.',`המירו ${nf(Dm)} מטר לק״מ (חלקו ב-1000).`,'חשבו זמן = מרחק ÷ מהירות בשעות, ואז כפלו ב-60 כדי לקבל דקות.'],
      steps:[`ממירים למרחק בק״מ: ${nf(Dm)} ÷ 1000 = <b>${km}</b> ק״מ.`,`זמן = ${km} ÷ ${vv} = <b>${h}</b> שעות.`,`בדקות: ${h} × 60 = <b>${t}</b> דקות.`],
      diag:wrongs([[rnd(Dm/vv),'לא המרתם מטרים לק״מ, ואי אפשר לחלק מטרים בק״מ לשעה.'],[h,'זה בשעות. שאלו בדקות – כפלו ב-60.'],[km,'זה המרחק בק״מ. עוד צריך לחלק במהירות.']])
    });
  }
  // combo with scale
  for(let g=0;g<2000;g++){
    const N=pick([10000,20000,25000,50000,100000]),Lm=lv===1?ri(2,20):ri(4,40)/2,km=rnd(Lm*N/100000),vv=pick([4,5,6,10,12,15,20,30,40,60,80]);
    const t=rnd(km/vv);
    if(km<2||km>80||Math.abs(km*100-Math.round(km*100))>1e-9)continue;
    if(Math.abs(t*4-Math.round(t*4))>1e-9||t<.25||t>6)continue;
    if(lv===1&&(t<1||Math.abs(t*2-Math.round(t*2))>1e-9))continue;
    const cm=Lm*N,minutes=lv===2,ans=minutes?rnd(t*60):t;
    return mk('speed',lv,{
      text:`במפה בקנה מידה ${R([1,N])} המרחק בין שתי עיירות הוא ${Lm} ס״מ. נוסעים ביניהן במהירות קבועה של ${vv} קמ״ש.<br><b>כמה ${minutes?'דקות':'שעות'} יימשך המסע?</b>`,
      svg:routeSvg(`${Lm} ס״מ במפה`,`קנה מידה 1:${N}`,`${vv} קמ״ש`),ans,unit:minutes?'דקות':'שעות',
      hints:['קודם צריך למצוא כמה ק״מ זה במציאות, בעזרת קנה המידה.',`${Lm} × ${nf(N)} = ס״מ במציאות. אחר כך חלקו ב-100,000 כדי לקבל ק״מ.`,`עכשיו זמן = מרחק ÷ מהירות${minutes?', ובסוף כפלו ב-60 כדי לקבל דקות':''}.`],
      steps:[`במציאות: ${Lm} × ${nf(N)} = <b>${nf(cm)}</b> ס״מ.`,`המרה לק״מ: ${nf(cm)} ÷ 100,000 = <b>${km}</b> ק״מ.`,`זמן = ${km} ÷ ${vv} = <b>${t}</b> שעות.`].concat(minutes?[`בדקות: ${t} × 60 = <b>${ans}</b> דקות.`]:[]),
      diag:wrongs([[km,'זה המרחק האמיתי בק״מ. עוד צריך לחלק במהירות כדי לקבל זמן.'],[rnd(Lm/vv),'לא השתמשתם בקנה המידה. המרחק במפה (בס״מ) הוא לא המרחק האמיתי.'],[t,'זה הזמן בשעות. שאלו בדקות – כפלו ב-60.'],[rnd(ans*60),'כפלתם ב-60 פעמיים או יותר מדי. בדקו שוב.']].concat(minutes?[]:[[rnd(t*60),'זה הזמן בדקות. שאלו בשעות.']]))
    });
  }
  return genSpeed(0);
}

const GEN={ratio:genRatio,prop:genProp,scale:genScale,pyth:genPyth,speed:genSpeed};

/* ============ קלט ותשובה ============ */
function parseAns(q,raw){
  const s=raw.replace(/[‎‏‪-‮]/g,'').trim();
  if(q.type==='yn'){
    if(/לא/.test(s))return {valid:true,val:false};
    if(/כן|yes/i.test(s))return {valid:true,val:true};
    return {valid:false,msg:'כתבו "כן" או "לא".'};
  }
  const nums=(s.replace(/(\d),(\d)/g,'$1.$2').match(/\d+(?:\.\d+)?/g)||[]).map(Number);
  if(q.type==='ratio'){
    if(nums.length<2)return {valid:false,msg:'כתבו יחס עם נקודותיים, למשל 3:5.'};
    return {valid:true,val:nums};
  }
  if(!nums.length)return {valid:false,msg:'כתבו את התשובה במספרים.'};
  const fr=s.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);
  const neg=/^\s*-/.test(s)?-1:1;
  return {valid:true,val:fr&&+fr[2]?neg*fr[1]/fr[2]:neg*nums[0]};
}
function matches(q,v){
  if(q.type==='yn')return v===q.ans;
  if(q.type==='ratio')return v.length===q.ans.length&&v.every((x,i)=>x===q.ans[i]);
  return near(v,q.ans);
}

/* ============ מצב ושמירה ============ */
const KEY='math8_practice_v1';
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.stats)return Object.assign({level:1,streak:0,best:0,hist:[]},d)}catch(e){}
  return {stats:{},streak:0,best:0,hist:[],level:1};
}
let S=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let sess=null;

const CHEER=['כל הכבוד! 🎉','מצוין! 💪','יפה מאוד! ⭐','אלוף/ה! 🚀','בדיוק נכון! 🔥','וואו, איזה כיף לראות! ✨','נהדר! המשיכו כך! 🌟'];

/* ============ מסכים ============ */
function setTop(title,showBar){
  $('#topTitle').textContent=title;
  $('#barWrap').style.display=$('#barTxt').style.display=showBar?'block':'none';
  $('#homeBtn').style.visibility=showBar||title!=='תרגול מתמטיקה'?'visible':'hidden';
  $('#streakChip').textContent='🔥 '+S.streak;
}
function pct(t){const s=S.stats[t];return s&&s.total?Math.round(100*s.ok/s.total):null}
function levelChips(){
  return `<div class="chips"><span class="lbl">רמת קושי:</span>${LVN.map((n,i)=>`<button class="chip ${S.level===i?'on':''}" onclick="setLevel(${i})">${n}</button>`).join('')}</div>`;
}
function setLevel(i){S.level=i;save();if(sess)renderQ(true);else renderHome();if(sess)toast()}
function toast(){const f=document.createElement('div');f.textContent='הרמה החדשה תחול מהשאלה הבאה';f.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#251e49;border:1px solid #3a3170;padding:10px 18px;border-radius:999px;z-index:60;font-size:15px';document.body.appendChild(f);setTimeout(()=>f.remove(),1800)}

function recommend(){
  const arr=TOPICS.map(t=>({t,p:pct(t),n:(S.stats[t]||{}).total||0}));
  const tried=arr.filter(x=>x.n>=3);
  if(!tried.length)return {txt:'ענו על כמה שאלות בכל נושא, ואחרי זה נמליץ לכם על מה כדאי לתרגל.',t:null};
  tried.sort((a,b)=>a.p-b.p);
  if(tried[0].p<85)return {txt:`כדאי לך לתרגל עוד את: <b>${NAME[tried[0].t]}</b> (${tried[0].p}% הצלחה)`,t:tried[0].t};
  const un=arr.filter(x=>x.n<3);
  if(un.length)return {txt:`הולך מעולה! נסו עכשיו את: <b>${NAME[un[0].t]}</b>`,t:un[0].t};
  return {txt:'כל הכבוד! אתם מעל 85% בכל הנושאים. נסו רמה קשה יותר 💪',t:null};
}
function renderHome(){
  sess=null;setTop('תרגול מתמטיקה',false);
  const tot=TOPICS.reduce((a,t)=>a+((S.stats[t]||{}).total||0),0),ok=TOPICS.reduce((a,t)=>a+((S.stats[t]||{}).ok||0),0);
  const rc=recommend();
  $('#view').innerHTML=`
    <h1>מתמטיקה כיתה ח׳ – <span>תרגול</span></h1>
    <p class="sub">בחרו נושא, פתרו, קבלו רמזים והסברים. שאלות חדשות בכל פעם!</p>
    <div class="stats">
      <div class="stat"><b>${S.streak} 🔥</b><small>רצף נוכחי</small></div>
      <div class="stat"><b>${S.best}</b><small>רצף שיא</small></div>
      <div class="stat"><b>${tot?Math.round(100*ok/tot)+'%':'–'}</b><small>הצלחה כללית (${tot} שאלות)</small></div>
    </div>
    ${levelChips()}
    <div class="reco"><div class="t">💡 ${rc.txt}</div>${rc.t?`<button class="chip on" onclick="startSession('${rc.t}')">בואו נתרגל</button>`:''}</div>
    <button class="mixed" onclick="startSession('mixed')">🎲 תרגול מעורבב</button>
    <div class="grid">${TOPICS.map(t=>{const s=S.stats[t]||{ok:0,total:0},p=pct(t);
      return `<button class="tcard" style="--c:${COL[t]}" onclick="startSession('${t}')">
        <div class="ic">${ICON[t]}</div><h3>${NAME[t]}</h3><p>${DESC[t]}</p>
        <div class="mini"><i style="width:${p||0}%"></i></div>
        <small>${s.total?`${p}% הצלחה · ${s.ok} מתוך ${s.total}`:'עוד לא התחלתם'}</small></button>`}).join('')}</div>
    <div class="row2"><button class="btn2" onclick="renderHistory()">📜 היסטוריית שאלות (${S.hist.length})</button>
    <button class="btn2" onclick="resetAll()">🗑️ איפוס התקדמות</button></div>`;
  window.scrollTo(0,0);
}
function goHome(){renderHome()}
function resetAll(){if(confirm('למחוק את כל ההתקדמות וההיסטוריה?')){S={stats:{},streak:0,best:0,hist:[],level:S.level};save();renderHome()}}

function startSession(topic){
  sess={topic,items:[],idx:0,r:0,rc:0};
  newQuestion();
}
function newQuestion(){
  const t=sess.topic==='mixed'?pick(TOPICS):sess.topic;
  let q;try{q=GEN[t](S.level)}catch(e){console.error(e);q=GEN[t](S.level)}
  sess.items.push({q,answered:false,user:'',ok:null,hints:0,msg:null,sol:false});
  sess.idx=sess.items.length-1;
  renderQ(false,true);
}
function renderBar(){
  const p=Math.min(100,sess.r*10);
  $('#bar').style.width=p+'%';
  $('#barTxt').textContent=`סבב נוכחי: ${sess.r} מתוך 10 שאלות · ${sess.rc} נכונות`;
  $('#streakChip').textContent='🔥 '+S.streak;
}
function renderQ(keep,anim){
  const it=sess.items[sess.idx],q=it.q,c=COL[q.topic];
  setTop(sess.topic==='mixed'?'🎲 תרגול מעורבב':ICON[sess.topic]+' '+NAME[sess.topic],true);renderBar();
  const last=sess.idx===sess.items.length-1;
  const hintsHtml=q.hints.slice(0,it.hints).map((h,i)=>`<div class="hint"><b>רמז ${i+1}:</b> ${mathify(h)}</div>`).join('');
  $('#view').innerHTML=`${levelChips()}
  <div class="qcard" id="qcard" style="--c:${c};${anim?'':'animation:none'}">
    <div class="qhead"><span class="tag">${ICON[q.topic]} ${NAME[q.topic]} · ${LVN[q.level]}</span><span class="qnum">שאלה ${sess.idx+1}</span></div>
    <div class="qtext">${q.text}</div>
    <div class="svgbox">${q.svg}</div>
    <div class="ansrow"><input id="ans" type="text" inputmode="${q.type==='yn'?'text':'decimal'}" autocomplete="off" enterkeyhint="done" placeholder="${q.type==='yn'?'כן או לא':q.type==='ratio'?'כתבו יחס, למשל 3:5':'כתבו את התשובה (אפשר עם יחידות)'}" value="${it.answered?String(it.user).replace(/"/g,'&quot;'):''}" ${it.answered?'disabled':''}>
    ${it.answered?'':`<button class="go" onclick="checkAnswer()">בדיקה</button>`}</div>
    ${q.type==='yn'&&!it.answered?`<div class="ynrow"><button class="chip" onclick="setYN('כן')">כן</button><button class="chip" onclick="setYN('לא')">לא</button></div>`:''}
    ${it.answered?'':`<div class="hintrow"><button class="hbtn" id="hbtn" onclick="giveHint()" ${it.hints>=q.hints.length?'disabled':''}>💡 רמז (${it.hints}/${q.hints.length})</button></div>`}
    <div id="hints">${hintsHtml}</div>
    <div id="fb">${it.answered?fbHtml(it):''}</div>
    <div class="nav">
      <button onclick="nav(-1)" ${sess.idx===0?'disabled':''}>→ חזרה אחורה</button>
      <button class="${it.answered?'primary':''}" onclick="nav(1)" ${(last&&!it.answered)?'disabled':''}>הבא ←</button>
    </div>
  </div>`;
  if(!anim)$('#qcard').style.animation='none';
  window.scrollTo({top:0,behavior:'instant'});
  if(!it.answered&&matchMedia('(pointer:fine)').matches)setTimeout(()=>$('#ans')&&$('#ans').focus(),50);
}
function setYN(v){$('#ans').value=v;checkAnswer()}
function fbHtml(it){
  const q=it.q,steps=`<ol>${q.steps.map(s=>`<li>${mathify(s)}</li>`).join('')}</ol>`;
  if(it.ok)return `<div class="fb ok"><h4>${it.cheer||pick(CHEER)}</h4>
    <div>התשובה נכונה: <b>${q.ansText}</b></div>
    ${it.sol?steps:`<button class="link" onclick="toggleSol()">איך פותרים? הצג פתרון</button>`}</div>`;
  return `<div class="fb no"><h4>לא נורא, בוא נבין יחד 💙</h4>
    <div>התשובה שלכם: <b dir="auto">${esc(it.user)}</b><br>התשובה הנכונה: <b>${q.ansText}</b></div>
    ${it.msg?`<div class="mistake">🔎 <b>כנראה הטעות:</b> ${it.msg}</div>`:`<div class="mistake">🔎 בדקו שוב את החישוב ואת סדר הצעדים למטה.</div>`}
    <b>הפתרון צעד אחר צעד:</b>${steps}</div>`;
}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toggleSol(){const it=sess.items[sess.idx];it.sol=true;$('#fb').innerHTML=fbHtml(it)}
function giveHint(){
  const it=sess.items[sess.idx];if(it.hints>=it.q.hints.length)return;
  it.hints++;renderQHints(it);
}
function renderQHints(it){
  const q=it.q;
  $('#hints').innerHTML=q.hints.slice(0,it.hints).map((h,i)=>`<div class="hint"><b>רמז ${i+1}:</b> ${mathify(h)}</div>`).join('');
  const b=$('#hbtn');b.textContent=`💡 רמז (${it.hints}/${q.hints.length})`;b.disabled=it.hints>=q.hints.length;
}
function checkAnswer(){
  const it=sess.items[sess.idx];if(it.answered)return;
  const inp=$('#ans'),raw=inp.value;
  if(!raw.trim()){shakeIn(inp);return}
  const p=parseAns(it.q,raw);
  if(!p.valid){shakeIn(inp);const fb=$('#fb');fb.innerHTML=`<div class="fb no"><h4>${p.msg}</h4></div>`;return}
  const ok=matches(it.q,p.val);
  it.answered=true;it.user=raw.trim();it.ok=ok;it.cheer=pick(CHEER);
  it.msg=ok?null:(it.q.diag?it.q.diag(p.val):null);
  const t=it.q.topic,st=S.stats[t]||(S.stats[t]={ok:0,total:0});
  st.total++;if(ok)st.ok++;
  if(ok){S.streak++;if(S.streak>S.best)S.best=S.streak}else S.streak=0;
  S.hist.unshift({t,lv:it.q.level,q:it.q.text,user:it.user,ans:it.q.ansText,ok,steps:it.q.steps,h:it.hints,ts:Date.now()});
  if(S.hist.length>150)S.hist.length=150;
  save();
  sess.r++;if(ok)sess.rc++;
  renderQ(true,false);
  if(ok){const c=$('#qcard');c.classList.add('pulse');confetti()}
  if(sess.r>=10)setTimeout(roundDone,ok?1300:2500);
}
function shakeIn(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake')}
function nav(d){
  const c=$('#qcard');
  if(d>0&&sess.idx===sess.items.length-1){if(!sess.items[sess.idx].answered)return;
    if(sess.r>=10)return roundDone();
    c.classList.add('leave');setTimeout(newQuestion,180);return}
  const n=sess.idx+d;if(n<0||n>=sess.items.length)return;
  c.classList.add('leave');setTimeout(()=>{sess.idx=n;renderQ(false,true)},180);
}
function roundDone(){
  if(!sess||sess.r<10)return;
  const m=$('#modal'),sc=sess.rc,rc=recommend();
  m.innerHTML=`<div class="mbox"><div style="font-size:48px">${sc>=9?'🏆':sc>=6?'🎉':'💪'}</div><h2>סיימתם סבב!</h2>
    <div class="big">${sc}/10</div>
    <p>${sc>=9?'מושלם! אתם אלופים.':sc>=6?'כל הכבוד, תוצאה יפה!':'כל תרגול משפר. נסו שוב ותראו התקדמות!'}</p>
    <p style="color:var(--muted);font-size:16px">💡 ${rc.txt}</p>
    <div class="row2"><button class="btn2" onclick="closeRound(false)">🏠 לבית</button><button class="chip on" style="flex:1;min-height:54px" onclick="closeRound(true)">סבב חדש ←</button></div></div>`;
  m.classList.add('on');confetti(40);
}
function closeRound(cont){
  $('#modal').classList.remove('on');
  if(!cont)return renderHome();
  sess.r=0;sess.rc=0;
  const last=sess.items[sess.items.length-1];
  if(sess.idx===sess.items.length-1&&last.answered)newQuestion();else renderQ(false,false);
}
function confetti(n=22){
  const fx=$('#fx'),em=['⭐','✨','🎉','💜','💎','🧡'];
  for(let i=0;i<n;i++){
    const s=document.createElement('span');s.className='conf';s.textContent=pick(em);
    s.style.setProperty('--dx',ri(-170,170)+'px');s.style.setProperty('--dy',ri(-260,-60)+'px');s.style.setProperty('--r',ri(-300,300)+'deg');
    s.style.animationDelay=ri(0,150)+'ms';fx.appendChild(s);setTimeout(()=>s.remove(),1400);
  }
}

/* ============ היסטוריה ============ */
const strip=h=>h.replace(/<br>.*$/,'').replace(/<[^>]+>/g,'');
function renderHistory(){
  sess=null;setTop('היסטוריית שאלות',false);$('#homeBtn').style.visibility='visible';
  const h=S.hist;
  $('#view').innerHTML=`<h1 style="font-size:26px">📜 <span>מה פתרתי</span></h1>
   <p class="sub">${h.length?`${h.length} השאלות האחרונות. לחצו על שאלה כדי לראות את ההסבר.`:'עוד אין שאלות. התחילו לתרגל!'}</p>
   ${h.map(x=>`<details class="hitem" style="--c:${COL[x.t]}"><summary><span class="mk">${x.ok?'✅':'❌'}</span><span class="tg">${NAME[x.t]}</span><span class="sn">${strip(x.q).slice(0,70)}</span></summary>
     <div class="bd"><p>${x.q}</p><p>התשובה שלי: <b dir="auto">${esc(x.user)}</b> ${x.ok?'✓':'✗'}<br>התשובה הנכונה: <b>${x.ans}</b><br><small>רמה: ${LVN[x.lv]}${x.h?` · רמזים: ${x.h}`:''}</small></p>
     <b>הפתרון:</b><ol>${x.steps.map(s=>`<li>${mathify(s)}</li>`).join('')}</ol></div></details>`).join('')}
   <div class="row2"><button class="btn2" onclick="renderHome()">← חזרה למסך הראשי</button></div>`;
  window.scrollTo(0,0);
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||!sess)return;
  if($('#modal').classList.contains('on'))return;
  const it=sess.items[sess.idx];
  if(it.answered)nav(1);else if(document.activeElement&&document.activeElement.id==='ans')checkAnswer();
});
renderHome();
</script>
