<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><title>כרזת בחירות</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1500px;font-family:'Arial Black',Arial,sans-serif;background:linear-gradient(160deg,#0b3d91,#1e88e5 60%,#ffb300);color:#fff;text-align:center;position:relative;overflow:hidden}
.top{padding:50px 40px 10px;font-size:70px;font-weight:900;text-shadow:4px 4px 0 #0006}
.party{font-size:48px;color:#ffeb3b;font-weight:900}
.photo{width:720px;height:720px;margin:30px auto;border:14px solid #fff;border-radius:50%;overflow:hidden;box-shadow:0 20px 50px #0008}
.photo img{width:100%;height:100%;object-fit:cover;object-position:50% 38%}
.name{font-size:84px;font-weight:900;text-shadow:4px 4px 0 #0006;margin-top:10px}
.slogan{font-size:62px;font-weight:900;color:#0b3d91;background:#ffeb3b;display:inline-block;padding:14px 50px;margin-top:30px;transform:rotate(-3deg);border-radius:12px}
.foot{position:absolute;bottom:30px;width:100%;font-size:40px}
</style></head><body>
<div class="top">הצביעו!</div>
<div class="party">מפלגת פיצוחי צריפה</div>
<div class="photo"><img src="photo.jpg"></div>
<div class="name">ראש המפלגה</div>
<div class="slogan">פיצוחים לכולם – יחד!</div>
<div class="foot">פיצוחי צריפה · העתיד מתחיל כאן 🗳️</div>
</body></html>
