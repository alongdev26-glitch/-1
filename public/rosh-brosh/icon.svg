<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ראש בראש">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8303f"/><stop offset=".55" stop-color="#a80f1d"/><stop offset="1" stop-color="#5e0612"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff2a8"/><stop offset=".45" stop-color="#ffc933"/><stop offset="1" stop-color="#c97800"/></linearGradient>
    <linearGradient id="goldH" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b86e00"/><stop offset=".5" stop-color="#ffe27a"/><stop offset="1" stop-color="#b86e00"/></linearGradient>
    <linearGradient id="inner" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b0711"/><stop offset="1" stop-color="#17020a"/></linearGradient>
    <linearGradient id="mane" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd447"/><stop offset="1" stop-color="#d98200"/></linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe9a0"/><stop offset="1" stop-color="#f0a52a"/></linearGradient>
    <linearGradient id="wolf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf0"/><stop offset="1" stop-color="#cdb98f"/></linearGradient>
    <linearGradient id="wolfDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8d9b0"/><stop offset="1" stop-color="#9c8458"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#ffd23f" stop-opacity=".7"/><stop offset="1" stop-color="#ff5a3d" stop-opacity="0"/></radialGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <clipPath id="shield"><path id="shieldPath" d="M256 70 386 108V246C386 330 336 394 256 432 176 394 126 330 126 246V108z"/></clipPath>
    <path id="star" d="m0-13 3.800 8.600 9.400.9-7 6.200 2 9.200L0 6.800-8.200 11.900l2-9.200-7-6.200 9.400-.9z"/>
    <path id="ray" d="M0 0 L-34 -420 L34 -420Z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <g transform="translate(256 250)" fill="#ffd23f" opacity=".13">
      <use href="#ray"/><use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>
    <circle cx="256" cy="250" r="220" fill="url(#glow)"/>

    <!-- shield -->
    <path d="M256 52 400 96V248C400 340 348 410 256 452 164 410 112 340 112 248V96z" fill="url(#gold)" stroke="#4d0510" stroke-width="10" stroke-linejoin="round"/>
    <use href="#shieldPath" fill="url(#inner)" stroke="#ffd23f" stroke-width="5"/>
    <g clip-path="url(#shield)">
      <circle cx="256" cy="250" r="150" fill="#ffd23f" opacity=".1"/>
      <!-- bolt -->
      <path transform="translate(256 0) scale(.82 1) translate(-287 0)" d="M262 92 238 226h30l-30 120 74-150h-34l36-104z" fill="#ffe14d" stroke="#7a1400" stroke-width="8" stroke-linejoin="round"/>
      <path transform="translate(256 0) scale(.82 1) translate(-287 0)" d="M262 100 246 210" fill="none" stroke="#fffbd0" stroke-width="5" stroke-linecap="round" opacity=".8"/>
      <!-- stars -->
      <g fill="#ffd23f" stroke="#7a4a00" stroke-width="2.500">
        <use href="#star" transform="translate(206 130) scale(.9)"/><use href="#star" transform="translate(314 130) scale(.9)"/>
        <use href="#star" transform="translate(256 370) scale(1.1)"/>
      </g>
    </g>
    <!-- heads (break out of the shield a little) -->
    <g>
      <!-- lion (left) -->
      <g transform="translate(-35.5 37.1) scale(.95)" stroke="#3a0510" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M236 152 212 124 204 154 176 134 180 168 146 160 164 196 132 204 158 236 134 262 170 272 156 306 192 304 190 338 226 316 240 346 252 296 258 230z" fill="url(#mane)"/>
        <path d="M212 168C232 154 256 168 262 192L282 214C288 220 284 228 276 230L272 238 280 246 266 252 270 268C262 290 234 298 212 290 192 270 192 192 212 168z" fill="url(#fur)"/>
        <path d="M268 240 282 247 268 253 271 266 250 261z" fill="#3a0510"/>
        <path d="M266 247 271 262 259 252zM278 240 282 249 272 245z" fill="#fff" stroke="none"/>
        <path d="M276 214 290 221 276 229z" fill="#3a0510"/>
        <path d="M228 190 252 198 248 208 230 202z" fill="#ffd23f"/><circle cx="244" cy="200" r="3.500" fill="#3a0510" stroke="none"/>
        <path d="M222 184 256 194" fill="none" stroke-width="9"/>
        <path d="M214 160 202 132 232 150z" fill="url(#mane)"/>
      </g>
      <!-- wolf (right), mirrored -->
      <g transform="translate(568.4 38) scale(-.95 .95)" stroke="#3a0510" stroke-width="8" stroke-linejoin="round" stroke-linecap="round">
        <path d="M222 168 160 190 184 206 150 232 182 242 160 270 198 268 192 304 226 296 240 330 258 290 262 230z" fill="url(#wolfDark)"/>
        <path d="M204 176 214 128 248 170z" fill="url(#wolf)"/><path d="M212 170 217 142 232 170z" fill="#c9605a" stroke="none"/>
        <path d="M206 186C212 164 238 160 252 178L274 198 304 214C312 218 310 228 300 230L276 234 286 242 266 250 270 270C258 290 228 296 208 280 192 256 194 206 206 186z" fill="url(#wolf)"/>
        <path d="M272 238 288 244 270 252 273 268 250 262z" fill="#3a0510"/>
        <path d="M268 246 273 264 260 253zM282 240 287 249 276 245z" fill="#fff" stroke="none"/>
        <path d="M296 214 312 221 296 230z" fill="#3a0510"/>
        <path d="M226 192 252 200 247 210 228 204z" fill="#ffd23f"/><circle cx="243" cy="202" r="3.500" fill="#3a0510" stroke="none"/>
        <path d="M220 186 256 196" fill="none" stroke-width="9"/>
      </g>
    </g>
    <!-- ribbon -->
    <g stroke="#4d0510" stroke-width="7" stroke-linejoin="round">
      <path d="M62 408 100 420 90 456 52 462 70 436z" fill="#b3121f"/><path d="M450 408 412 420 422 456 460 462 442 436z" fill="#b3121f"/>
      <path d="M88 396H424V450H88z" fill="url(#gold)"/>
    </g>
    <path d="M88 410H424" stroke="#fff6c8" stroke-opacity=".6" stroke-width="3"/>
    <text x="256" y="437" text-anchor="middle" direction="rtl" font-family="Rubik, Heebo, 'Arial Hebrew', FreeSans, 'DejaVu Sans', Arial, sans-serif" font-weight="900" font-size="46" fill="#5e0612" stroke="#fff3b0" stroke-width="1.2" paint-order="stroke">ראש בראש</text>
    <path d="M0 0h512v200C380 238 130 238 0 190z" fill="#fff" opacity=".07"/>
  </g>
  <rect x="9" y="9" width="494" height="494" rx="108" fill="none" stroke="#ffd23f" stroke-width="9"/>
  <rect x="21" y="21" width="470" height="470" rx="96" fill="none" stroke="#4d0510" stroke-opacity=".45" stroke-width="3"/>
</svg>
