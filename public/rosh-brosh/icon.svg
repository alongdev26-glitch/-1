<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="ראש בראש">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a4d"/><stop offset=".5" stop-color="#d4202f"/><stop offset="1" stop-color="#7d0818"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".5" stop-color="#ffc933"/><stop offset="1" stop-color="#e98a00"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffd9c0"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#ffe27a" stop-opacity=".95"/><stop offset=".6" stop-color="#ff9a3d" stop-opacity=".35"/><stop offset="1" stop-color="#ff5a3d" stop-opacity="0"/></radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="116"/></clipPath>
    <!-- profile head facing right -->
    <path id="head" d="M44 236 62 176C24 156 12 104 44 64 76 22 138 22 160 58c6 10 4 22 12 34l16 28-16 7c3 11 6 15 0 23 3 7-1 14-10 18l-8 15-8 18 10 32z"/>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sunburst -->
    <g transform="translate(256 270)" fill="#ffd23f" opacity=".12">
      <path id="ray" d="M0 0 L-34 -420 L34 -420Z"/>
      <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/><use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/>
      <use href="#ray" transform="rotate(180)"/><use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/><use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
    </g>
    <circle cx="256" cy="270" r="215" fill="url(#glow)"/>
    <!-- heads, face to face -->
    <g stroke="#4d0510" stroke-width="12" stroke-linejoin="round" stroke-linecap="round">
      <use href="#head" fill="url(#gold)" transform="translate(40 190) scale(1.02)"/>
      <use href="#head" fill="url(#cream)" transform="translate(472 190) scale(-1.02 1.02)"/>
      <!-- bolt between the foreheads -->
      <path d="M270 214 226 292h34l-18 70 70-96h-38l26-52z" fill="#ffe14d" stroke="#7a1400"/>
      <!-- crown -->
      <path d="M176 156 164 92l48 36 44-62 44 62 48-36-12 64z" fill="url(#gold)"/>
      <rect x="176" y="156" width="160" height="26" rx="9" fill="#f5a30a"/>
    </g>
    <g fill="#fff6d6" stroke="#4d0510" stroke-width="7">
      <circle cx="164" cy="92" r="10"/><circle cx="256" cy="66" r="10"/><circle cx="348" cy="92" r="10"/>
    </g>
    <circle cx="256" cy="169" r="7" fill="#ef4444" stroke="#4d0510" stroke-width="4"/>
    <!-- bottom plinth -->
    <path d="M40 452h432v40H40z" fill="#4d0510" opacity=".35"/>
    <!-- gloss -->
    <path d="M0 0h512v210C380 250 130 250 0 200z" fill="url(#gloss)"/>
  </g>
  <rect x="9" y="9" width="494" height="494" rx="108" fill="none" stroke="#ffd23f" stroke-width="9"/>
  <rect x="21" y="21" width="470" height="470" rx="96" fill="none" stroke="#4d0510" stroke-opacity=".45" stroke-width="3"/>
</svg>
