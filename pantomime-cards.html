<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>פתקי פנטומימה</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231f2937'/%3E%3Crect x='8' y='8' width='16' height='16' fill='%23c9a227'/%3E%3C/svg%3E">
<style>
  @page { size: A4; margin: 12mm; }
  :root {
    --ink: #1f2937;
    --paper: #faf7f0;
    --line: #d9d2c0;
    --no: #b4472f;
    --movie: #34548a;
    --yes: #2f6f55;
    --food: #b9791f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #ece8dd; font-family: "Heebo", "Arial", sans-serif; color: var(--ink); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; max-width: 960px; margin: 0 auto; }
  .card {
    position: relative; aspect-ratio: 3 / 2; background: var(--paper);
    border: 1px solid var(--line); border-radius: 2px; padding: 20px 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    break-inside: avoid; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 8px; background: var(--c); }
  .mark { width: 28px; height: 28px; color: var(--c); margin-top: 6px; }
  .word { font-size: 28px; font-weight: 700; line-height: 1.15; min-height: 34px; }
  .rule { height: 1px; background: var(--line); }
  .no  { --c: var(--no); }
  .yes { --c: var(--yes); }
  @media print {
    body { background: #fff; padding: 0; }
    .grid { grid-template-columns: repeat(2, 1fr); max-width: none; }
  }
</style>
</head>
<body>
<main class="grid">

  </article>

  </article>

  <article class="card no">

    <div class="word">יותר מדי אנימציות גלילה</div><div class="rule"></div>
  </article>

  <article class="card yes">

    <div class="word">להסיר את תג "נוצר עם AI"</div><div class="rule"></div>

    <div class="word">כותרות עם טקסט כללי</div><div class="rule"></div>
  </article>

  </article>

  <article class="card no">

</main>
</body>
</html>
