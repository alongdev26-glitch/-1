<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מערכת שעות שבועית</title>
<meta name="theme-color" content="#2f5d8a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
:root{
  --bg:#f4f6f9;--card:#fff;--ink:#1d2733;--muted:#6b7785;--line:#e3e8ee;--accent:#2f5d8a;--today:#fff8e1;
  --school:#4a7fb5;--garden:#5fa35f;--friends:#e08a3c;--study:#8a6bbf;--strength:#c9503f;--run:#1f9d9a;--other:#7a8794;--meal:#b5a03a;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171d;--card:#1a2129;--ink:#e8edf2;--muted:#93a0ad;--line:#2b3641;--today:#2a2a1a}
}
*{box-sizing:border-box}
body{margin:0;font-family:"Segoe UI",Arial,"Noto Sans Hebrew",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:14px 16px}
h1{margin:0;font-size:1.3rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:8px}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.danger{color:#c9503f}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 10px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.wrap{margin:0 16px 24px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.grid{display:grid;grid-template-columns:56px repeat(7,minmax(96px,1fr));min-width:760px}
.head{position:sticky;top:0;background:var(--card);border-bottom:2px solid var(--line);padding:10px 4px;text-align:center;font-weight:600;z-index:3}
.head.today{background:var(--today);color:var(--accent)}
.times{position:relative}
.times div{position:absolute;inset-inline:0;text-align:center;font-size:.75rem;color:var(--muted);transform:translateY(-50%);direction:ltr}
.times div:first-child{transform:translateY(3px)}
.times div:last-child{transform:translateY(-100%)}
.col{position:relative;border-inline-start:1px solid var(--line);
  background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--h)}
.col.today{background-color:var(--today)}
.ev{position:absolute;border-radius:7px;color:#fff;padding:3px 6px;font-size:.78rem;line-height:1.25;overflow:hidden;cursor:pointer;
  border:1px solid rgba(255,255,255,.35);box-shadow:0 1px 3px rgba(0,0,0,.2)}
.ev b{display:block}
.ev small{opacity:.9}
.ev:hover{filter:brightness(1.08)}
dialog{border:none;border-radius:14px;padding:20px;width:min(420px,92vw);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
label{display:block;margin:10px 0 4px;font-size:.9rem;color:var(--muted)}
input[type=text],input[type=time],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:8px;font:inherit;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:10px}.row>div{flex:1}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:inline-flex;align-items:center;gap:4px;margin:0;padding:5px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink);cursor:pointer}
.foot{display:flex;gap:8px;margin-top:18px;justify-content:space-between}
@media print{header .actions,.legend{display:none}body{background:#fff}.wrap{border:none}}
</style>
</head>
<body>
<header>
  <h1>🗓️ מערכת שעות שבועית</h1>
  <div class="actions">
    <button class="primary" id="add">+ הוספת פעילות</button>
    <button id="print">הדפסה</button>
    <button id="reset" class="danger">איפוס</button>
  </div>
</header>
<div class="legend" id="legend"></div>
<div class="wrap"><div class="grid" id="grid"></div></div>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h2 id="dlgTitle" style="margin:0 0 6px">פעילות</h2>
    <label for="title">שם</label>
    <input type="text" id="title" required>
    <label for="cat">סוג</label>
    <select id="cat"></select>
    <div class="row">
      <div><label for="start">התחלה</label><input type="time" id="start" required></div>
      <div><label for="end">סיום</label><input type="time" id="end" required></div>
    </div>
    <label>ימים</label>
    <div class="days" id="days"></div>
    <div class="foot">
      <button type="button" class="danger" id="del">מחיקה</button>
      <span>
        <button type="button" id="cancel">ביטול</button>
        <button type="submit" class="primary">שמירה</button>
      </span>
    </div>
  </form>
</dialog>

<script>
const DAYS=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const CATS={school:['שעות בית ספר','--school'],garden:['עבודה בגינה','--garden'],friends:['מפגש עם חברים','--friends'],
  study:['זמן למידה','--study'],strength:['אימון כוח','--strength'],run:['ריצה','--run'],meal:['ארוחות','--meal'],other:['אחר','--other']};
const FROM=7,TO=22,H=66,KEY='weekly-schedule-v3';

function defaults(){
  const e=[];let n=0;
  const add=(title,cat,days,start,end)=>days.forEach(d=>e.push({id:++n,title,cat,day:d,start,end}));
  // מערכת בית הספר (ראשון=0 ... חמישי=4)
  const T={p:['08:10','08:40'],1:['08:40','09:25'],2:['09:25','10:05'],3:['10:30','11:15'],4:['11:15','11:55'],
           5:['12:05','12:45'],6:['13:10','13:50'],7:['13:50','14:30'],8:['14:35','15:15']};
  const SCH={
    0:{p:'תפילה/שיח',1:'מדעים',2:'מתמטיקה',3:'אנגלית',4:'אנגלית',5:'חינוך',6:'שליח',7:'תנ"ך',8:'תנ"ך'},
    1:{p:'תפילה/שיח',1:'מדעים',2:'עברית',3:'תנ"ך',4:'כישורי חיים',5:'שעת בחירה',6:'שעת בחירה',7:'מדעים'},
    2:{p:'תפילה/שיח',1:'מדעים',2:'הלכה ומשנה',3:'עברית',4:'עברית',5:'מתמטיקה',6:'מתמטיקה'},
    3:{p:'תפילה/שיח',1:'מדעים',2:'תנ"ך',3:'אנגלית',4:'אנגלית',5:'חנ"ג'},
    4:{p:'תפילה/שיח',1:'ספרות',2:'היסטוריה',3:'מתמטיקה',4:'מתמטיקה',5:'ספרות',6:'היסטוריה',7:'חנ"ג'}};
  Object.entries(SCH).forEach(([d,l])=>Object.entries(l).forEach(([k,t])=>add(t,'school',[+d],T[k][0],T[k][1])));
  add('הלכה ומשנה','school',[3],'13:10','14:30'); // רביעי, שעות 6–7 (תא ממוזג)
  add('עבודה בגינה','garden',[0,4],'16:00','17:00');             // ראשון וחמישי ב-16:00
  add('מפגש עם חברים','friends',[0,1,3,4],'17:15','18:15');     // ראשון, שני, רביעי, חמישי (לא שלישי/שישי/שבת)
  add('לימוד מתמטיקה','study',[2],'16:00','17:00');              // פעם בשבוע אחרי הלימודים
  add('לימוד אנגלית','study',[1],'15:30','16:30');               // פעם בשבוע אחרי הלימודים
  add('ארוחת בוקר','meal',[0,1,2,3,4],'07:30','08:00');
  add('ארוחת בוקר','meal',[5],'09:30','10:00');
  add('ארוחת בוקר','meal',[6],'10:30','11:00');
  add('ארוחת צהריים','meal',[0],'15:20','15:50');
  add('ארוחת צהריים','meal',[1,3,4],'14:30','15:00');
  add('ארוחת צהריים','meal',[2],'14:00','14:30');
  add('ארוחת צהריים','meal',[5,6],'13:00','13:30');
  add('זמן למידה','study',[0,1,2,3,4],'19:30','20:30');
  add('אימון כוח','strength',[1,3],'18:30','19:30');             // שני ורביעי
  add('ריצה','run',[2,4],'18:30','19:15');                       // שלישי וחמישי
  add('ריצה','run',[6],'09:00','10:00');                         // שבת
  return e;
}
let events;
try{events=JSON.parse(localStorage.getItem(KEY))}catch(_){}
if(!Array.isArray(events))events=defaults();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(events))}catch(_){}};
const mins=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const $=id=>document.getElementById(id);
const nextId=()=>events.reduce((m,e)=>Math.max(m,e.id),0)+1;

function layout(list){ // side-by-side columns for overlapping events
  list=[...list].sort((a,b)=>mins(a.start)-mins(b.start));
  const out=[];let group=[],end=0;
  const flush=()=>{const cols=[];group.forEach(ev=>{let c=cols.findIndex(x=>x<=mins(ev.start));if(c<0){c=cols.length;cols.push(0)}cols[c]=mins(ev.end);ev._c=c});
    group.forEach(ev=>{ev._n=cols.length;out.push(ev)});group=[]};
  list.forEach(ev=>{if(group.length&&mins(ev.start)>=end)flush();group.push({...ev});end=Math.max(end,mins(ev.end))});
  flush();return out;
}

function render(){
  const g=$('grid');g.innerHTML='';g.style.setProperty('--h',H+'px');
  const today=new Date().getDay();
  g.append(Object.assign(document.createElement('div'),{className:'head',textContent:'שעה'}));
  DAYS.forEach((d,i)=>g.append(Object.assign(document.createElement('div'),{className:'head'+(i===today?' today':''),textContent:'יום '+d})));
  const times=document.createElement('div');times.className='times';times.style.height=(TO-FROM)*H+'px';
  for(let h=FROM;h<=TO;h++){const t=document.createElement('div');t.style.top=(h-FROM)*H+'px';t.textContent=String(h).padStart(2,'0')+':00';times.append(t)}
  g.append(times);
  for(let d=0;d<7;d++){
    const col=document.createElement('div');col.className='col'+(d===today?' today':'');col.style.height=(TO-FROM)*H+'px';
    layout(events.filter(e=>e.day===d)).forEach(ev=>{
      const el=document.createElement('div');el.className='ev';
      el.style.top=(mins(ev.start)-FROM*60)/60*H+'px';
      el.style.height=Math.max(20,(mins(ev.end)-mins(ev.start))/60*H-2)+'px';
      el.style.width=`calc(${100/ev._n}% - 4px)`;el.style.insetInlineStart=`calc(${ev._c*100/ev._n}% + 2px)`;
      el.style.background=`var(${CATS[ev.cat]?CATS[ev.cat][1]:'--other'})`;
      el.innerHTML=`<b></b><small dir="ltr" style="display:block;text-align:right">${ev.start}–${ev.end}</small>`;el.querySelector('b').textContent=ev.title;
      el.onclick=()=>openDlg(ev);col.append(el);
    });
    g.append(col);
  }
}

function legend(){
  $('legend').innerHTML=Object.values(CATS).map(([n,v])=>`<span><i style="background:var(${v})"></i>${n}</span>`).join('');
  $('cat').innerHTML=Object.entries(CATS).map(([k,[n]])=>`<option value="${k}">${n}</option>`).join('');
  $('days').innerHTML=DAYS.map((d,i)=>`<label><input type="checkbox" value="${i}"> ${d}</label>`).join('');
}

let editing=null;
function openDlg(ev){
  editing=ev||null;
  $('dlgTitle').textContent=ev?'עריכת פעילות':'פעילות חדשה';
  $('title').value=ev?ev.title:'';$('cat').value=ev?ev.cat:'other';
  $('start').value=ev?ev.start:'16:00';$('end').value=ev?ev.end:'17:00';
  document.querySelectorAll('#days input').forEach(c=>c.checked=ev?+c.value===ev.day:false);
  $('del').style.display=ev?'':'none';
  $('dlg').showModal();
}
$('add').onclick=()=>openDlg();
$('cancel').onclick=()=>$('dlg').close();
$('del').onclick=()=>{events=events.filter(e=>e.id!==editing.id);save();render();$('dlg').close()};
$('form').onsubmit=()=>{
  const days=[...document.querySelectorAll('#days input:checked')].map(c=>+c.value);
  const s=$('start').value,e=$('end').value;
  if(!days.length||mins(e)<=mins(s)||mins(s)<FROM*60||mins(e)>TO*60){alert('בדקו: בחרו יום, ושעת הסיום אחרי ההתחלה (בין '+FROM+':00 ל-'+TO+':00).');return false}
  const base={title:$('title').value.trim(),cat:$('cat').value,start:s,end:e};
  if(editing){events=events.filter(x=>x.id!==editing.id)}
  days.forEach(d=>events.push({id:nextId(),day:d,...base}));
  save();render();
};
$('print').onclick=()=>print();
$('reset').onclick=()=>{if(confirm('לאפס את המערכת לברירת המחדל?')){events=defaults();save();render()}};
legend();render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
