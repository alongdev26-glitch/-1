<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>1 על 1</title>
<style>
html,body{margin:0;height:100%;background:#111;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none}
#wrap{position:relative;height:100%;display:flex;justify-content:center}
canvas{height:100%;max-width:100%;background:#1a7a2e}
#hud{position:absolute;top:0;left:0;right:0;text-align:center;font-size:28px;font-weight:800;padding:8px;pointer-events:none;text-shadow:0 2px 4px #000}
#msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#000a;font-size:32px;font-weight:800;gap:16px;text-align:center}
button{font-size:22px;padding:12px 32px;border:0;border-radius:12px;background:#7b3fe4;color:#fff;font-weight:700}
#shoot{position:absolute;right:24px;bottom:32px;width:92px;height:92px;border-radius:50%;background:#e43f3fcc;font-size:18px;display:none}
#stick{position:absolute;left:24px;bottom:32px;width:120px;height:120px;border-radius:50%;background:#fff3;display:none}
#knob{position:absolute;left:40px;top:40px;width:40px;height:40px;border-radius:50%;background:#fffa}
</style>
</head>
<body>
<div id="wrap">
<canvas id="c" width="360" height="600"></canvas>
<div id="hud">אתה 0 : 0 מחשב &nbsp;·&nbsp; <span id="t">90</span></div>
<div id="stick"><div id="knob"></div></div>
<button id="shoot">בעיטה</button>
<div id="msg"><div>1 על 1<br><small style="font-size:18px">שחקן אחד נגד המחשב · 90 שניות<br>מקשים: חצים/WASD + רווח לבעיטה</small></div><button id="go">התחל</button></div>
</div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=360,H=600,GW=90,R=14,BR=7;
const hud=document.getElementById('hud'),tEl=document.getElementById('t'),msg=document.getElementById('msg');
let me,cpu,ball,sc,time,state='menu',kick=0,kickCool=0,input={x:0,y:0},keys={};
function reset(kickoffMe){
  me={x:W/2,y:H*0.72,vx:0,vy:0};
  cpu={x:W/2,y:H*0.28,vx:0,vy:0,cool:0};
  ball={x:W/2,y:H/2,vx:0,vy:0};
}
function start(){sc=[0,0];time=90;reset();state='play';msg.style.display='none';
  const touch='ontouchstart' in window;
  document.getElementById('stick').style.display=document.getElementById('shoot').style.display=touch?'block':'none';}
document.getElementById('go').onclick=start;
addEventListener('keydown',e=>{keys[e.code]=true;if(e.code=='Space')kick=1;});
addEventListener('keyup',e=>keys[e.code]=false);
// joystick
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let sid=null;
function sMove(t){const r=stick.getBoundingClientRect();let dx=t.clientX-(r.left+60),dy=t.clientY-(r.top+60);
  const d=Math.hypot(dx,dy),m=50;if(d>m){dx*=m/d;dy*=m/d}
  knob.style.left=40+dx+'px';knob.style.top=40+dy+'px';input.x=dx/m;input.y=dy/m;}
stick.addEventListener('touchstart',e=>{e.preventDefault();sid=e.changedTouches[0].identifier;sMove(e.changedTouches[0])});
stick.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier==sid)sMove(t)});
stick.addEventListener('touchend',e=>{sid=null;input.x=input.y=0;knob.style.left=knob.style.top='40px'});
document.getElementById('shoot').addEventListener('touchstart',e=>{e.preventDefault();kick=1});
function goal(who){sc[who]++;state='goal';msg.style.display='flex';msg.innerHTML='<div>גול! '+(who?'המחשב':'אתה')+'</div>';
  setTimeout(()=>{if(state=='goal'){msg.style.display='none';reset();state='play'}},1200);}
function end(){state='end';msg.style.display='flex';
  const r=sc[0]>sc[1]?'ניצחת! 🏆':sc[0]<sc[1]?'הפסדת':'תיקו';
  msg.innerHTML='<div>'+r+'<br>'+sc[0]+' : '+sc[1]+'</div><button onclick="start()">שוב</button>';}
function move(p,ax,ay,sp){
  p.vx+=ax*0.9;p.vy+=ay*0.9;p.vx*=0.82;p.vy*=0.82;
  const s=Math.hypot(p.vx,p.vy);if(s>sp){p.vx*=sp/s;p.vy*=sp/s}
  p.x=Math.max(R,Math.min(W-R,p.x+p.vx));p.y=Math.max(R,Math.min(H-R,p.y+p.vy));}
function touching(p){return Math.hypot(ball.x-p.x,ball.y-p.y)<R+BR+3}
function dribble(p){
  const d=Math.hypot(ball.x-p.x,ball.y-p.y)||1,nx=(ball.x-p.x)/d,ny=(ball.y-p.y)/d;
  // push ball out and add player velocity
  ball.x=p.x+nx*(R+BR);ball.y=p.y+ny*(R+BR);
  ball.vx=ball.vx*0.5+p.vx*0.9+nx*0.4;ball.vy=ball.vy*0.5+p.vy*0.9+ny*0.4;}
function shoot(p,tx,ty,pw){
  const d=Math.hypot(tx-ball.x,ty-ball.y)||1;ball.vx=(tx-ball.x)/d*pw;ball.vy=(ty-ball.y)/d*pw;}
function update(){
  if(state!='play')return;
  let ax=input.x,ay=input.y;
  if(keys.ArrowLeft||keys.KeyA)ax-=1;if(keys.ArrowRight||keys.KeyD)ax+=1;
  if(keys.ArrowUp||keys.KeyW)ay-=1;if(keys.ArrowDown||keys.KeyS)ay+=1;
  move(me,ax,ay,3.2);
  if(kick&&touching(me)&&kickCool<=0){
    const dx=ax||0,dy=ay||0;
    // aim: toward opponent goal (top), nudged by stick direction
    shoot(me,W/2+dx*80+(W/2-me.x)*0.2*0,0,11);kickCool=15;}
  kick=0;kickCool--;
  // cpu
  const hasBall=Math.hypot(ball.x-cpu.x,ball.y-cpu.y)<R+BR+8;
  let tx,ty;
  if(hasBall){tx=W/2+Math.sin(performance.now()/700)*60;ty=H;}
  else{
    // go behind the ball relative to my goal, i.e. position between ball and own goal, then charge
    tx=ball.x;ty=ball.y;
    if(Math.hypot(ball.x-me.x,ball.y-me.y)<R+BR+8){tx=ball.x;ty=ball.y}
  }
  let dx=tx-cpu.x,dy=ty-cpu.y,d=Math.hypot(dx,dy)||1;
  move(cpu,dx/d,dy/d,2.5);
  cpu.cool--;
  if(hasBall&&cpu.y>H*0.55&&cpu.cool<=0&&Math.random()<0.08){
    shoot(cpu,W/2+(Math.random()-0.5)*GW*0.8,H,10);cpu.cool=45;}
  // ball
  if(touching(me)&&kickCool<=0)dribble(me);
  else if(touching(cpu)&&cpu.cool<=0)dribble(cpu);
  ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=0.985;ball.vy*=0.985;
  const gl=(W-GW)/2,gr=(W+GW)/2;
  if(ball.x<BR){ball.x=BR;ball.vx*=-0.7}
  if(ball.x>W-BR){ball.x=W-BR;ball.vx*=-0.7}
  if(ball.y<BR){if(ball.x>gl&&ball.x<gr)return goal(0);ball.y=BR;ball.vy*=-0.7}
  if(ball.y>H-BR){if(ball.x>gl&&ball.x<gr)return goal(1);ball.y=H-BR;ball.vy*=-0.7}
}
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000;last=now;
  if(state=='play'){time-=dt;if(time<=0){time=0;end()}}
  update();draw();requestAnimationFrame(loop);
}
function draw(){
  ctx.fillStyle='#1a7a2e';ctx.fillRect(0,0,W,H);
  for(let i=0;i<10;i++){if(i%2){ctx.fillStyle='#ffffff10';ctx.fillRect(0,i*H/10,W,H/10)}}
  ctx.strokeStyle='#fff';ctx.lineWidth=2;
  ctx.strokeRect(10,10,W-20,H-20);
  ctx.beginPath();ctx.moveTo(10,H/2);ctx.lineTo(W-10,H/2);ctx.stroke();
  ctx.beginPath();ctx.arc(W/2,H/2,50,0,7);ctx.stroke();
  ctx.strokeRect((W-180)/2,10,180,70);ctx.strokeRect((W-180)/2,H-80,180,70);
  ctx.fillStyle='#fff';ctx.fillRect((W-GW)/2,0,GW,6);ctx.fillRect((W-GW)/2,H-6,GW,6);
  const dot=(p,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.arc(p.x,p.y,R,0,7);ctx.fill();ctx.strokeStyle='#fff';ctx.stroke()};
  dot(me,'#2aa3e0');dot(cpu,'#7b3fe4');
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(ball.x,ball.y,BR,0,7);ctx.fill();
  ctx.strokeStyle='#000';ctx.lineWidth=1;ctx.stroke();
  if(sc)hud.firstChild.textContent='אתה '+sc[0]+' : '+sc[1]+' מחשב  ·  ';
  tEl.textContent=Math.ceil(time||90);
}
reset();requestAnimationFrame(loop);
</script>
</body>
</html>
